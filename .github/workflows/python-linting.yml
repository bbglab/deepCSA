name: Python linting

on:
  push:
    branches:
      - dev
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  ruff:
    name: Ruff lint (bin/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install ruff
        run: pip install ruff==0.17.3

      - name: Run ruff
        run: ruff check bin/ --output-format=github

  black:
    name: Black format check (bin/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install black
        run: pip install black==26.10.1

      - name: Run black --check
        run: black --check --diff bin/
