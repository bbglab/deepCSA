name: PLOT_SELECTION_DEPTH
description: Generate selection metric (omega, OncodriveFML) vs depth plots
keywords:
  - plot
  - depth
  - omega
  - oncodrivefml
  - selection
tools:
  - custom:
      description: Custom Python script for plotting selection metrics vs depth

input:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. [ id:'test', single_end:false ]
  - omega:
      type: file
      description: Omega (dN/dS) results file with per-gene metrics
      pattern: "*.{tsv}"
  - oncodrivefml:
      type: file
      description: OncodriveFML results file with per-gene scores
      pattern: "*.{tsv}"
  - depth:
      type: file
      description: Depth per gene file with average depth information
      pattern: "*.{tsv}"

output:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. [ id:'test', single_end:false ]
  - plots:
      type: file
      description: PDF file containing selection metric vs depth plots
      pattern: "*.selection_depth.pdf"
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"

authors:
  - "@copilot"
