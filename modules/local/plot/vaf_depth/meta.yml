name: PLOT_VAF_DEPTH
description: Generate VAF vs depth plots with hyperbolic curves for various metrics
keywords:
  - plot
  - vaf
  - depth
  - mutation
  - density
  - omega
  - oncodrivefml
tools:
  - custom:
      description: Custom Python script for plotting VAF vs depth relationships

input:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. [ id:'test', single_end:false ]
  - maf:
      type: file
      description: MAF file containing mutations with VAF and depth information
      pattern: "*.{maf,tsv}"
  - mutdensity:
      type: file
      description: Mutation density file with per-gene metrics
      pattern: "*.{tsv}"
  - omega:
      type: file
      description: Omega (dN/dS) results file with per-gene metrics
      pattern: "*.{tsv}"
  - oncodrivefml:
      type: file
      description: OncodriveFML results file with per-gene scores
      pattern: "*.{tsv}"
  - meta2:
      type: map
      description: |
        Groovy Map containing depth file metadata
  - depth:
      type: file
      description: Depth per gene file with average depth information
      pattern: "*.{tsv}"

output:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. [ id:'test', single_end:false ]
  - plots:
      type: file
      description: PDF file containing VAF vs depth plots
      pattern: "*.vaf_depth_plots.pdf"
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"

authors:
  - "@copilot"
